<script type="text/babel">
const { useState, useEffect, useRef } = React;
const NOMBRE_NEGOCIO = "Dulce Benjamín";

function resizeImagen(file, callback, maxW){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const ancho = maxW || 500;
      const scale = Math.min(1, ancho / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function imagenesDe(p){
  if(p.imagenes && p.imagenes.length) return p.imagenes;
  if(p.imagen) return [p.imagen];
  return [];
}
function variantesDe(p){
  if(p.variantes && p.variantes.length) return p.variantes;
  if(p.precio) return [{cantidad:1, precio:p.precio}];
  return [];
}
function pagadoDe(pedido){
  return Object.values(pedido.pagos||{}).reduce((a,p)=>a+p.monto,0);
}
function debeDe(pedido){
  return pedido.total - pagadoDe(pedido);
}
function fechaCorta(ts){
  return new Date(ts).toLocaleDateString('es-AR');
}

function App(){
  const [productos, setProductos] = useState({});
  const [categorias, setCategorias] = useState([]);
  const [config, setConfig] = useState({whatsapp:'', instagram:'', logo:''});
  const [pedidos, setPedidos] = useState({});
  const [clientes, setClientes] = useState({});
  const [categoria, setCategoria] = useState('Todos');
  const [busqueda, setBusqueda] = useState('');
  const [carrito, setCarrito] = useState([]);
  const [mostrarCarrito, setMostrarCarrito] = useState(false);
  const [productoVisto, setProductoVisto] = useState(null);
  const [indiceImagen, setIndiceImagen] = useState(0);
  const abrioCompartidoRef = useRef(false);

  const [loggedIn, setLoggedIn] = useState(false);
  const [mostrarLogin, setMostrarLogin] = useState(false);
  const [mostrarAdmin, setMostrarAdmin] = useState(false);
  const [adminTab, setAdminTab] = useState('tablero');
  const [usuario, setUsuario] = useState('');
  const [contrasena, setContrasena] = useState('');
  const [errorLogin, setErrorLogin] = useState('');

  const [form, setForm] = useState({nombre:'', categoria:'', descripcion:'', imagenes:[], agotado:false, variantes:[{cantidad:'1', precio:''}]});
  const [editandoId, setEditandoId] = useState(null);
  const [nuevaCategoria, setNuevaCategoria] = useState('');
  const [whatsappInput, setWhatsappInput] = useState('');
  const [instagramInput, setInstagramInput] = useState('');

  const [datosPedido, setDatosPedido] = useState({nombre:'', telefono:'', zona:'', fecha:''});
  const [pedidoEnviado, setPedidoEnviado] = useState(false);
  const [montoPagoInputs, setMontoPagoInputs] = useState({});

  const [presClienteNombre, setPresClienteNombre] = useState('');
  const [presClienteTelefono, setPresClienteTelefono] = useState('');
  const [presItems, setPresItems] = useState([]);
  const [presProductoId, setPresProductoId] = useState('');
  const [presVarianteIdx, setPresVarianteIdx] = useState(0);
  const [presCantidad, setPresCantidad] = useState('1');
  const [presOtroNombre, setPresOtroNombre] = useState('');
  const [presOtroPrecio, setPresOtroPrecio] = useState('');

  const [aumentoPorcentaje, setAumentoPorcentaje] = useState('');
  const [aumentoRedondeo, setAumentoRedondeo] = useState('1000');

  const [mostrarPresupuestoPublico, setMostrarPresupuestoPublico] = useState(false);
  const [pubProductoId, setPubProductoId] = useState('');
  const [pubVarianteIdx, setPubVarianteIdx] = useState(0);
  const [pubCantidad, setPubCantidad] = useState('1');
  const [pubItems, setPubItems] = useState([]);

  useEffect(() => {
    db.ref('productos').on('value', snap => setProductos(snap.val() || {}));
    db.ref('categorias').on('value', snap => setCategorias(snap.val() || []));
    db.ref('pedidos').on('value', snap => setPedidos(snap.val() || {}));
    db.ref('clientes').on('value', snap => setClientes(snap.val() || {}));
    db.ref('config').on('value', snap => {
      const c = snap.val() || {whatsapp:'', instagram:'', logo:''};
      setConfig(c);
      setWhatsappInput(c.whatsapp || '');
      setInstagramInput(c.instagram || '');
    });
  }, []);

  useEffect(() => {
    const pedidosRef = db.ref('pedidos');
    let idsIniciales = new Set();
    let listo = false;
    pedidosRef.once('value').then(snap => {
      if(snap.exists()) idsIniciales = new Set(Object.keys(snap.val()));
      listo = true;
    });
    const handler = snap => {
      if(!listo) return;
      if(!idsIniciales.has(snap.key)){
        idsIniciales.add(snap.key);
        if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
          const v = snap.val();
          new Notification('Nuevo pedido en Dulce Benjamín', {body: `${v.nombre} - $${v.total}`});
        }
      }
    };
    pedidosRef.on('child_added', handler);
    return () => pedidosRef.off('child_added', handler);
  }, []);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('producto');
    if(id && productos[id] && !abrioCompartidoRef.current){
      abrioCompartidoRef.current = true;
      setProductoVisto({id, ...productos[id]});
      setIndiceImagen(0);
    }
  }, [productos]);

  const listaProductos = Object.entries(productos).map(([id, p]) => ({id, ...p}));
  const productosFiltrados = listaProductos
    .filter(p => categoria === 'Todos' || p.categoria === categoria)
    .filter(p => !busqueda || p.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const listaPedidos = Object.entries(pedidos).map(([id, p]) => ({id, ...p})).sort((a,b)=>(b.creado||0)-(a.creado||0));
  const listaClientes = Object.entries(clientes).map(([id, c]) => ({id, ...c}));
  const pedidosPendientes = listaPedidos.filter(p => p.estado === 'recibido').length;

  function agregarAlCarrito(producto, variante){
    const cartId = producto.id + '-' + variante.cantidad;
    setCarrito(prev => {
      const existe = prev.find(i => i.cartId === cartId);
      if(existe) return prev.map(i => i.cartId===cartId ? {...i, unidades: i.unidades+1} : i);
      return [...prev, {cartId, productoId: producto.id, nombre: producto.nombre, cantidadPack: variante.cantidad, precioPack: variante.precio, unidades: 1}];
    });
  }
  function cambiarUnidades(cartId, delta){
    setCarrito(prev => prev.map(i => i.cartId===cartId ? {...i, unidades: i.unidades+delta} : i).filter(i => i.unidades>0));
  }
  function quitarDelCarrito(cartId){
    setCarrito(prev => prev.filter(i => i.cartId !== cartId));
  }
  const total = carrito.reduce((acc,i)=>acc+i.precioPack*i.unidades,0);
  const cantidadTotal = carrito.reduce((a,i)=>a+i.unidades,0);

  function abrirProducto(p){
    setProductoVisto(p);
    setIndiceImagen(0);
  }

  function compartirProducto(p){
    const url = window.location.origin + window.location.pathname + '?producto=' + p.id;
    if(navigator.share){
      navigator.share({title: p.nombre, text: p.descripcion || 'Mirá este producto de Dulce Benjamín', url}).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(url);
      alert('Link copiado, ya lo podés pegar donde quieras');
    }
  }

  function pedirNotificaciones(){
    if(typeof Notification !== 'undefined') Notification.requestPermission();
  }

  function enviarPedido(){
    if(!datosPedido.nombre || !datosPedido.telefono || !datosPedido.zona || !datosPedido.fecha) return;
    if(carrito.length===0) return;
    db.ref('pedidos').push().set({
      items: carrito,
      total,
      nombre: datosPedido.nombre,
      telefono: datosPedido.telefono,
      zona: datosPedido.zona,
      fecha: datosPedido.fecha,
      estado: 'recibido',
      creado: Date.now()
    });

    if(config.whatsapp){
      const lineas = ['Hola! Quiero hacer un pedido:'];
      carrito.forEach(i => lineas.push(`- ${i.unidades} x (${i.nombre} - pack de ${i.cantidadPack}) = $${i.precioPack*i.unidades}`));
      lineas.push(`Total: $${total}`);
      lineas.push(`Nombre: ${datosPedido.nombre}`);
      lineas.push(`Teléfono: ${datosPedido.telefono}`);
      lineas.push(`Zona: ${datosPedido.zona}`);
      lineas.push(`Fecha del evento: ${datosPedido.fecha}`);
      const mensaje = encodeURIComponent(lineas.join('\n'));
      window.open(`https://wa.me/${config.whatsapp}?text=${mensaje}`, '_blank');
    }

    setPedidoEnviado(true);
    setCarrito([]);
    setDatosPedido({nombre:'', telefono:'', zona:'', fecha:''});
    setTimeout(()=>{ setPedidoEnviado(false); setMostrarCarrito(false); }, 2500);
  }

  function cambiarEstadoPedido(id, estado){
    db.ref('pedidos/'+id+'/estado').set(estado);
  }

  function registrarPago(pedido){
    const monto = Number(montoPagoInputs[pedido.id]);
    if(!monto || monto<=0) return;
    db.ref('pedidos/'+pedido.id+'/pagos').push().set({monto, fecha: Date.now()});
    setMontoPagoInputs(prev => ({...prev, [pedido.id]: ''}));
  }

  function generarRecibo(pedido, pago){
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(20);
    doc.setTextColor(219,39,119);
    doc.text(NOMBRE_NEGOCIO, 14, 20);
    doc.setFontSize(14);
    doc.setTextColor(80,80,80);
    doc.text('Recibo de pago', 14, 32);
    doc.setFontSize(11);
    doc.text(`Cliente: ${pedido.nombre}`, 14, 44);
    doc.text(`Fecha de pago: ${fechaCorta(pago.fecha)}`, 14, 51);
    doc.text(`Monto pagado: $${pago.monto}`, 14, 58);
    doc.text(`Total del pedido: $${pedido.total}`, 14, 65);
    doc.text(`Saldo restante: $${debeDe(pedido)}`, 14, 72);
    doc.save(`recibo-${pedido.nombre.replace(/\s+/g,'_')}-${fechaCorta(pago.fecha).replace(/\//g,'-')}.pdf`);
  }

  function intentarLogin(){
    if(usuario === 'Micaela' && contrasena === 'pablo'){
      setLoggedIn(true);
      setMostrarLogin(false);
      setErrorLogin('');
      setUsuario(''); setContrasena('');
    } else {
      setErrorLogin('Usuario o contraseña incorrectos');
    }
  }
  function cerrarSesion(){
    setLoggedIn(false);
    setMostrarAdmin(false);
  }

  function editarProducto(p){
    setForm({
      nombre: p.nombre,
      categoria: p.categoria,
      descripcion: p.descripcion || '',
      imagenes: imagenesDe(p),
      agotado: !!p.agotado,
      variantes: variantesDe(p).map(v=>({cantidad:String(v.cantidad), precio:String(v.precio)}))
    });
    setEditandoId(p.id);
    setAdminTab('productos');
  }
  function resetForm(){
    setForm({nombre:'', categoria:'', descripcion:'', imagenes:[], agotado:false, variantes:[{cantidad:'1', precio:''}]});
    setEditandoId(null);
  }
  function guardarProducto(){
    const variantesValidas = form.variantes.filter(v=>v.cantidad && v.precio).map(v=>({cantidad:Number(v.cantidad), precio:Number(v.precio)}));
    if(!form.nombre || !form.categoria || variantesValidas.length===0) return;
    const id = editandoId || db.ref('productos').push().key;
    db.ref('productos/'+id).set({
      nombre: form.nombre,
      categoria: form.categoria,
      descripcion: form.descripcion || '',
      imagenes: form.imagenes,
      agotado: form.agotado,
      variantes: variantesValidas
    });
    resetForm();
  }
  function eliminarProducto(id){
    db.ref('productos/'+id).remove();
  }
  function handleImagenes(e){
    const files = Array.from(e.target.files);
    files.forEach(file => {
      resizeImagen(file, (dataUrl) => setForm(f => ({...f, imagenes: [...f.imagenes, dataUrl]})));
    });
    e.target.value = '';
  }
  function quitarImagenForm(idx){
    setForm(f => ({...f, imagenes: f.imagenes.filter((_,i)=>i!==idx)}));
  }
  function cambiarVariante(idx, campo, valor){
    setForm(f => ({...f, variantes: f.variantes.map((v,i)=> i===idx ? {...v, [campo]: valor} : v)}));
  }
  function agregarFilaVariante(){
    setForm(f => ({...f, variantes: [...f.variantes, {cantidad:'', precio:''}]}));
  }
  function quitarFilaVariante(idx){
    setForm(f => ({...f, variantes: f.variantes.filter((_,i)=>i!==idx)}));
  }

  function agregarCategoria(){
    if(!nuevaCategoria || categorias.includes(nuevaCategoria)) return;
    db.ref('categorias').set([...categorias, nuevaCategoria]);
    setNuevaCategoria('');
  }
  function eliminarCategoria(cat){
    db.ref('categorias').set(categorias.filter(c => c !== cat));
  }

  function guardarConfig(){
    db.ref('config').set({...config, whatsapp: whatsappInput, instagram: instagramInput});
  }
  function handleLogo(e){
    const file = e.target.files[0];
    if(!file) return;
    resizeImagen(file, (dataUrl) => {
      db.ref('config').set({...config, whatsapp: whatsappInput, instagram: instagramInput, logo: dataUrl});
    }, 300);
  }

  function aplicarAumento(){
    const pct = Number(aumentoPorcentaje);
    const redondeo = Number(aumentoRedondeo);
    if(!pct || !redondeo) return;
    if(!window.confirm(`¿Aumentar todos los precios un ${pct}% redondeando a $${redondeo}? No se puede deshacer.`)) return;
    const actualizados = {};
    Object.entries(productos).forEach(([id,p]) => {
      const nuevasVariantes = variantesDe(p).map(v => {
        const nuevo = v.precio * (1 + pct/100);
        return {cantidad: v.cantidad, precio: Math.round(nuevo/redondeo)*redondeo};
      });
      actualizados[id] = {...p, variantes: nuevasVariantes};
    });
    db.ref('productos').set(actualizados);
    setAumentoPorcentaje('');
  }

  function guardarClienteNuevo(){
    if(!presClienteNombre) return;
    const yaExiste = listaClientes.find(c => c.nombre.toLowerCase()===presClienteNombre.toLowerCase());
    if(yaExiste) return;
    db.ref('clientes').push().set({nombre: presClienteNombre, telefono: presClienteTelefono});
  }
  function elegirClienteExistente(id){
    if(!id) { setPresClienteNombre(''); setPresClienteTelefono(''); return; }
    const c = clientes[id];
    setPresClienteNombre(c.nombre);
    setPresClienteTelefono(c.telefono || '');
  }
  function agregarItemPresupuesto(){
    if(!presProductoId) return;
    const p = productos[presProductoId];
    const variante = variantesDe(p)[presVarianteIdx];
    const cant = Number(presCantidad) || 1;
    setPresItems(prev => [...prev, {nombre: `${p.nombre} (pack ${variante.cantidad})`, cantidad: cant, precio: variante.precio}]);
    setPresCantidad('1');
  }
  function agregarItemLibre(){
    if(!presOtroNombre || !presOtroPrecio) return;
    setPresItems(prev => [...prev, {nombre: presOtroNombre, cantidad: 1, precio: Number(presOtroPrecio)}]);
    setPresOtroNombre(''); setPresOtroPrecio('');
  }
  function quitarItemPresupuesto(idx){
    setPresItems(prev => prev.filter((_,i)=>i!==idx));
  }
  const totalPresupuesto = presItems.reduce((a,it)=>a+it.cantidad*it.precio,0);

  function generarPresupuestoPDF(){
    if(!presClienteNombre || presItems.length===0) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    if(config.logo){
      try{
        const fmt = config.logo.startsWith('data:image/png') ? 'PNG' : 'JPEG';
        doc.addImage(config.logo, fmt, 160, 10, 35, 35);
      }catch(e){}
    }
    doc.setFontSize(20);
    doc.setTextColor(219,39,119);
    doc.text(NOMBRE_NEGOCIO, 14, 20);
    doc.setFontSize(11);
    doc.setTextColor(90,90,90);
    doc.text(`Presupuesto para: ${presClienteNombre}`, 14, 32);
    if(presClienteTelefono) doc.text(`Teléfono: ${presClienteTelefono}`, 14, 38);
    doc.text(`Fecha: ${new Date().toLocaleDateString('es-AR')}`, 14, 44);

    const filas = presItems.map(it => [it.nombre, String(it.cantidad), `$${it.precio}`, `$${it.cantidad*it.precio}`]);
    doc.autoTable({
      head: [['Producto','Cantidad','Precio unit.','Subtotal']],
      body: filas,
      startY: 52,
      theme: 'grid',
      headStyles: {fillColor:[244,114,182]}
    });

    doc.setFontSize(14);
    doc.setTextColor(219,39,119);
    doc.text(`Total: $${totalPresupuesto}`, 14, doc.lastAutoTable.finalY + 12);
    doc.setFontSize(10);
    doc.setTextColor(150,150,150);
    doc.text('¡Gracias por elegirnos! Cualquier consulta, escribinos.', 14, doc.lastAutoTable.finalY + 22);

    doc.save(`presupuesto-${presClienteNombre.replace(/\s+/g,'_')}.pdf`);
  }

  function agregarItemPublico(){
    if(!pubProductoId) return;
    const p = productos[pubProductoId];
    const variante = variantesDe(p)[pubVarianteIdx];
    const cant = Number(pubCantidad) || 1;
    setPubItems(prev => [...prev, {nombre: `${p.nombre} (pack ${variante.cantidad})`, cantidad: cant, precio: variante.precio}]);
    setPubCantidad('1');
  }
  function quitarItemPublico(idx){
    setPubItems(prev => prev.filter((_,i)=>i!==idx));
  }
  const pubTotal = pubItems.reduce((a,it)=>a+it.cantidad*it.precio,0);
  function enviarPresupuestoPublicoWhatsapp(){
    const lineas = ['Hola! Armé este presupuesto en la página:'];
    pubItems.forEach(it => lineas.push(`- ${it.cantidad}x ${it.nombre} = $${it.cantidad*it.precio}`));
    lineas.push(`Total estimado: $${pubTotal}`);
    lineas.push('(No incluye envío, precios sujetos a confirmación)');
    const mensaje = encodeURIComponent(lineas.join('\n'));
    window.open(`https://wa.me/${config.whatsapp}?text=${mensaje}`, '_blank');
  }

  const ESTADOS = [
    {key:'recibido', label:'Recibido', color:'bg-yellow-400'},
    {key:'en_proceso', label:'En proceso', color:'bg-blue-400'},
    {key:'entregado', label:'Entregado', color:'bg-green-500'},
    {key:'rechazado', label:'Rechazado', color:'bg-red-500'}
  ];

  const ahora = new Date();
  // el dashboard solo cuenta pedidos confirmados: "recibido" todavía puede no concretarse
  // y "rechazado" no debe sumar ingresos.
  const pedidosConfirmados = listaPedidos.filter(p => p.estado==='en_proceso' || p.estado==='entregado');
  const pedidosDelMes = pedidosConfirmados.filter(p => {
    const d = new Date(p.creado||0);
    return d.getMonth()===ahora.getMonth() && d.getFullYear()===ahora.getFullYear();
  });
  const totalVendidoMes = pedidosDelMes.reduce((a,p)=>a+p.total,0);
  const totalCobradoGlobal = pedidosConfirmados.reduce((a,p)=>a+pagadoDe(p),0);
  const totalPendienteGlobal = pedidosConfirmados.reduce((a,p)=>a+Math.max(debeDe(p),0),0);
  const rankingProductos = (() => {
    const conteo = {};
    pedidosConfirmados.forEach(p => (p.items||[]).forEach(it => { conteo[it.nombre] = (conteo[it.nombre]||0) + it.unidades; }));
    return Object.entries(conteo).sort((a,b)=>b[1]-a[1]).slice(0,5);
  })();
  const maxRanking = rankingProductos.length ? rankingProductos[0][1] : 1;

  return (
    <div className="min-h-screen bg-pink-50">
      <header className="flex justify-between items-center p-4 bg-white shadow sticky top-0 z-10 flex-wrap gap-2">
        <h1 className="text-xl md:text-2xl font-bold text-pink-600">Dulce Benjamín</h1>
        <div className="flex gap-2 items-center flex-wrap">
          {config.whatsapp && (
            <a href={"https://wa.me/"+config.whatsapp} target="_blank"

                  const pagado = pagadoDe(ped);
                  const debe = debeDe(ped);
                  const pagosArr = Object.entries(ped.pagos||{}).map(([id,pg])=>({id,...pg})).sort((a,b)=>a.fecha-b.fecha);
                  return (
                    <div key={ped.id} className="border rounded p-3 mb-3">
                      <p className="font-semibold text-sm">{ped.nombre} - {ped.telefono}</p>
                      <p className="text-xs text-gray-500">Zona: {ped.zona} | Evento: {ped.fecha}</p>
                      <div className="my-2">
                        {(ped.items||[]).map((it,idx)=>(
                          <p key={idx} className="text-xs text-gray-600">{it.unidades}x {it.nombre} (pack {it.cantidadPack} - ${it.precioPack})</p>
                        ))}
                      </div>
                      <p className="font-bold text-pink-600">Total: ${ped.total}</p>
                      <p className="text-xs text-green-600">Cobrado: ${pagado}</p>
                      <p className={`text-xs font-bold ${debe>0 ? 'text-red-500' : 'text-green-600'}`}>{debe>0 ? `Debe: $${debe}` : 'Saldado ✓'}</p>

                      {pagosArr.length>0 && (
                        <div className="mt-2 space-y-1">
                          {pagosArr.map(pg=>(
                            <div key={pg.id} className="flex justify-between items-center text-xs bg-gray-50 rounded px-2 py-1">
                              <span>{fechaCorta(pg.fecha)} — ${pg.monto}</span>
                              <button onClick={()=>generarRecibo(ped,pg)} className="text-blue-500">🧾 Recibo</button>
                            </div>
                          ))}
                        </div>
                      )}

                      {debe>0 && (
                        <div className="flex gap-2 mt-2">
                          <input value={montoPagoInputs[ped.id]||''} onChange={e=>setMontoPagoInputs(prev=>({...prev,[ped.id]:e.target.value}))} type="number" placeholder="Monto pagado" className="border rounded p-2 flex-1 text-sm"/>
                          <button onClick={()=>registrarPago(ped)} className="bg-green-500 text-white px-3 rounded text-sm">Registrar pago</button>
                        </div>
                      )}

                      <div className="flex gap-2 flex-wrap mt-3">
                        {ESTADOS.map(e=>(
                          <button key={e.key} onClick={()=>cambiarEstadoPedido(ped.id, e.key)}
                            className={`px-3 py-1 rounded-full text-xs text-white ${ped.estado===e.key ? e.color : 'bg-gray-300'}`}>
                            {e.label}
                          </button>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}

            {adminTab==='presupuestos' && (
              <div>
                <h3 className="font-bold mb-2">Presupuesto para clienta</h3>

                <select onChange={e=>elegirClienteExistente(e.target.value)} className="border rounded w-full p-2 mb-2">
                  <option value="">-- Elegir clienta guardada --</option>
                  {listaClientes.map(c => <option key={c.id} value={c.id}>{c.nombre}</option>)}
                </select>
                <input value={presClienteNombre} onChange={e=>setPresClienteNombre(e.target.value)} placeholder="Nombre de la clienta" className="border rounded w-full p-2 mb-2"/>
                <input value={presClienteTelefono} onChange={e=>setPresClienteTelefono(e.target.value)} placeholder="Teléfono (opcional)" className="border rounded w-full p-2 mb-2"/>
                <button onClick={guardarClienteNuevo} className="text-sm text-pink-600 mb-4">+ Guardar como clienta nueva</button>

                <h4 className="font-bold text-sm mb-2">Agregar producto del catálogo</h4>
                <select value={presProductoId} onChange={e=>{setPresProductoId(e.target.value); setPresVarianteIdx(0);}} className="border rounded w-full p-2 mb-2">
                  <option value="">Elegir producto</option>
                  {listaProductos.map(p => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
                {presProductoId && (
                  <select value={presVarianteIdx} onChange={e=>setPresVarianteIdx(Number(e.target.value))} className="border rounded w-full p-2 mb-2">
                    {variantesDe(productos[presProductoId]).map((v,idx)=>(
                      <option key={idx} value={idx}>{v.cantidad} unidad(es) — ${v.precio}</option>
                    ))}
                  </select>
                )}
                <div className="flex gap-2 mb-4">
                  <input value={presCantidad} onChange={e=>setPresCantidad(e.target.value)} type="number" placeholder="Cantidad de packs" className="border rounded p-2 flex-1"/>
                  <button onClick={agregarItemPresupuesto} className="bg-pink-500 text-white px-4 rounded">Agregar</button>
                </div>

                <h4 className="font-bold text-sm mb-2">O agregar un ítem libre (no del catálogo)</h4>
                <div className="flex gap-2 mb-4">
                  <input value={presOtroNombre} onChange={e=>setPresOtroNombre(e.target.value)} placeholder="Descripción" className="border rounded p-2 flex-1"/>
                  <input value={presOtroPrecio} onChange={e=>setPresOtroPrecio(e.target.value)} type="number" placeholder="Precio" className="border rounded p-2 w-24"/>
                  <button onClick={agregarItemLibre} className="bg-pink-500 text-white px-3 rounded">+</button>
                </div>

                <h4 className="font-bold text-sm mb-2">Ítems del presupuesto</h4>
                {presItems.length===0 && <p className="text-gray-400 text-sm mb-2">Todavía no agregaste productos.</p>}
                {presItems.map((it,idx)=>(
                  <div key={idx} className="flex justify-between items-center border-b py-2 text-sm">
                    <span>{it.cantidad}x {it.nombre} — ${it.cantidad*it.precio}</span>
                    <button onClick={()=>quitarItemPresupuesto(idx)} className="text-red-500">🗑</button>
                  </div>
                ))}
                <p className="font-bold text-lg text-right my-3">Total: ${totalPresupuesto}</p>

                <button onClick={generarPresupuestoPDF} className="w-full bg-pink-500 text-white py-3 rounded-full font-bold shadow-md hover:shadow-lg transition-all">
                  📄 Generar PDF del presupuesto
                </button>
                <p className="text-xs text-gray-400 mt-2 text-center">Se descarga el PDF; después lo adjuntás vos en el chat de WhatsApp.</p>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
