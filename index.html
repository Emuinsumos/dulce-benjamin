  firebase.initializeApp(firebaseConfig);

<script type="text/babel">
const { useState, useEffect, useRef } = React;

function resizeImagen(file, callback){
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 500;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function imagenesDe(p){
  if(p.imagenes && p.imagenes.length) return p.imagenes;
  if(p.imagen) return [p.imagen];
  return [];
}

function variantesDe(p){
  if(p.variantes && p.variantes.length) return p.variantes;
  if(p.precio) return [{cantidad:1, precio:p.precio}];
  return [];
}

function App(){
  const [productos, setProductos] = useState({});
  const [categorias, setCategorias] = useState([]);
  const [config, setConfig] = useState({whatsapp:'', instagram:''});
  const [pedidos, setPedidos] = useState({});
  const [categoria, setCategoria] = useState('Todos');
  const [busqueda, setBusqueda] = useState('');
  const [carrito, setCarrito] = useState([]);
  const [mostrarCarrito, setMostrarCarrito] = useState(false);
  const [productoVisto, setProductoVisto] = useState(null);
  const [indiceImagen, setIndiceImagen] = useState(0);
  const abrioCompartidoRef = useRef(false);

  const [loggedIn, setLoggedIn] = useState(false);
  const [mostrarLogin, setMostrarLogin] = useState(false);
  const [mostrarAdmin, setMostrarAdmin] = useState(false);
  const [adminTab, setAdminTab] = useState('productos');
  const [usuario, setUsuario] = useState('');
  const [contrasena, setContrasena] = useState('');
  const [errorLogin, setErrorLogin] = useState('');

  const [form, setForm] = useState({nombre:'', categoria:'', descripcion:'', imagenes:[], agotado:false, variantes:[{cantidad:'1', precio:''}]});
  const [editandoId, setEditandoId] = useState(null);
  const [nuevaCategoria, setNuevaCategoria] = useState('');
  const [whatsappInput, setWhatsappInput] = useState('');
  const [instagramInput, setInstagramInput] = useState('');

  const [datosPedido, setDatosPedido] = useState({nombre:'', telefono:'', zona:'', fecha:''});
  const [pedidoEnviado, setPedidoEnviado] = useState(false);

  useEffect(() => {
    db.ref('productos').on('value', snap => setProductos(snap.val() || {}));
    db.ref('categorias').on('value', snap => setCategorias(snap.val() || []));
    db.ref('pedidos').on('value', snap => setPedidos(snap.val() || {}));
    db.ref('config').on('value', snap => {
      const c = snap.val() || {whatsapp:'', instagram:''};
      setConfig(c);
      setWhatsappInput(c.whatsapp || '');
      setInstagramInput(c.instagram || '');
    });
  }, []);

  // notificaciones de pedidos nuevos (solo mientras la pestaña está abierta)
  useEffect(() => {
    const pedidosRef = db.ref('pedidos');
    let idsIniciales = new Set();
    let listo = false;
    pedidosRef.once('value').then(snap => {
      if(snap.exists()) idsIniciales = new Set(Object.keys(snap.val()));
      listo = true;
    });
    const handler = snap => {
      if(!listo) return;
      if(!idsIniciales.has(snap.key)){
        idsIniciales.add(snap.key);
        if(typeof Notification !== 'undefined' && Notification.permission === 'granted'){
          const v = snap.val();
          new Notification('Nuevo pedido en Dulce Benjamín', {body: `${v.nombre} - $${v.total}`});
        }
      }
    };
    pedidosRef.on('child_added', handler);
    return () => pedidosRef.off('child_added', handler);
  }, []);

  // abrir producto compartido por link
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('producto');
    if(id && productos[id] && !abrioCompartidoRef.current){
      abrioCompartidoRef.current = true;
      setProductoVisto({id, ...productos[id]});
      setIndiceImagen(0);
    }
  }, [productos]);

  const listaProductos = Object.entries(productos).map(([id, p]) => ({id, ...p}));
  const productosFiltrados = listaProductos
    .filter(p => categoria === 'Todos' || p.categoria === categoria)
    .filter(p => !busqueda || p.nombre.toLowerCase().includes(busqueda.toLowerCase()));
  const listaPedidos = Object.entries(pedidos).map(([id, p]) => ({id, ...p})).sort((a,b)=>(b.creado||0)-(a.creado||0));
  const pedidosPendientes = listaPedidos.filter(p => p.estado === 'recibido').length;

  function agregarAlCarrito(producto, variante){
    const cartId = producto.id + '-' + variante.cantidad;
    setCarrito(prev => {
      const existe = prev.find(i => i.cartId === cartId);
      if(existe) return prev.map(i => i.cartId===cartId ? {...i, unidades: i.unidades+1} : i);
      return [...prev, {cartId, productoId: producto.id, nombre: producto.nombre, cantidadPack: variante.cantidad, precioPack: variante.precio, unidades: 1}];
    });
  }
  function cambiarUnidades(cartId, delta){
    setCarrito(prev => prev.map(i => i.cartId===cartId ? {...i, unidades: i.unidades+delta} : i).filter(i => i.unidades>0));
  }
  function quitarDelCarrito(cartId){
    setCarrito(prev => prev.filter(i => i.cartId !== cartId));
  }
  const total = carrito.reduce((acc,i)=>acc+i.precioPack*i.unidades,0);
  const cantidadTotal = carrito.reduce((a,i)=>a+i.unidades,0);

  function abrirProducto(p){
    setProductoVisto(p);
    setIndiceImagen(0);
  }

  function compartirProducto(p){
    const url = window.location.origin + window.location.pathname + '?producto=' + p.id;
    if(navigator.share){
      navigator.share({title: p.nombre, text: p.descripcion || 'Mirá este producto de Dulce Benjamín', url}).catch(()=>{});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(url);
      alert('Link copiado, ya lo podés pegar donde quieras');
    }
  }

  function pedirNotificaciones(){
    if(typeof Notification !== 'undefined') Notification.requestPermission();
  }

  function enviarPedido(){
    if(!datosPedido.nombre || !datosPedido.telefono || !datosPedido.zona || !datosPedido.fecha) return;
    if(carrito.length===0) return;
    db.ref('pedidos').push().set({
      items: carrito,
      total,
      nombre: datosPedido.nombre,
      telefono: datosPedido.telefono,
      zona: datosPedido.zona,
      fecha: datosPedido.fecha,
      estado: 'recibido',
      creado: Date.now()
    });

    if(config.whatsapp){
      const lineas = ['Hola! Quiero hacer un pedido:'];
      carrito.forEach(i => lineas.push(`- ${i.unidades} x (${i.nombre} - pack de ${i.cantidadPack}) = $${i.precioPack*i.unidades}`));
      lineas.push(`Total: $${total}`);
      lineas.push(`Nombre: ${datosPedido.nombre}`);
      lineas.push(`Teléfono: ${datosPedido.telefono}`);
      lineas.push(`Zona: ${datosPedido.zona}`);
      lineas.push(`Fecha del evento: ${datosPedido.fecha}`);
      const mensaje = encodeURIComponent(lineas.join('\n'));
      window.open(`https://wa.me/${config.whatsapp}?text=${mensaje}`, '_blank');
    }

    setPedidoEnviado(true);
    setCarrito([]);
    setDatosPedido({nombre:'', telefono:'', zona:'', fecha:''});
    setTimeout(()=>{ setPedidoEnviado(false); setMostrarCarrito(false); }, 2500);
  }

  function cambiarEstadoPedido(id, estado){
    db.ref('pedidos/'+id+'/estado').set(estado);
  }

  function intentarLogin(){
    if(usuario === 'Micaela' && contrasena === 'pablo'){
      setLoggedIn(true);
      setMostrarLogin(false);
      setErrorLogin('');
      setUsuario(''); setContrasena('');
    } else {
      setErrorLogin('Usuario o contraseña incorrectos');
    }
  }
  function cerrarSesion(){
    setLoggedIn(false);
    setMostrarAdmin(false);
  }

  function editarProducto(p){
    setForm({
      nombre: p.nombre,
      categoria: p.categoria,
      descripcion: p.descripcion || '',
      imagenes: imagenesDe(p),
      agotado: !!p.agotado,
      variantes: variantesDe(p).map(v=>({cantidad:String(v.cantidad), precio:String(v.precio)}))
    });
    setEditandoId(p.id);
    setAdminTab('productos');
  }
  function resetForm(){
    setForm({nombre:'', categoria:'', descripcion:'', imagenes:[], agotado:false, variantes:[{cantidad:'1', precio:''}]});
    setEditandoId(null);
  }
  function guardarProducto(){
    const variantesValidas = form.variantes.filter(v=>v.cantidad && v.precio).map(v=>({cantidad:Number(v.cantidad), precio:Number(v.precio)}));
    if(!form.nombre || !form.categoria || variantesValidas.length===0) return;
    const id = editandoId || db.ref('productos').push().key;
    db.ref('productos/'+id).set({
      nombre: form.nombre,
      categoria: form.categoria,
      descripcion: form.descripcion || '',
      imagenes: form.imagenes,
      agotado: form.agotado,
      variantes: variantesValidas
    });
    resetForm();
  }
  function eliminarProducto(id){
    db.ref('productos/'+id).remove();
  }
  function handleImagenes(e){
    const files = Array.from(e.target.files);
    files.forEach(file => {
      resizeImagen(file, (dataUrl) => setForm(f => ({...f, imagenes: [...f.imagenes, dataUrl]})));
    });
    e.target.value = '';
  }
  function quitarImagenForm(idx){
    setForm(f => ({...f, imagenes: f.imagenes.filter((_,i)=>i!==idx)}));
  }
  function cambiarVariante(idx, campo, valor){
    setForm(f => ({...f, variantes: f.variantes.map((v,i)=> i===idx ? {...v, [campo]: valor} : v)}));
  }
  function agregarFilaVariante(){
    setForm(f => ({...f, variantes: [...f.variantes, {cantidad:'', precio:''}]}));
  }
  function quitarFilaVariante(idx){
    setForm(f => ({...f, variantes: f.variantes.filter((_,i)=>i!==idx)}));
  }

  function agregarCategoria(){
    if(!nuevaCategoria || categorias.includes(nuevaCategoria)) return;
    db.ref('categorias').set([...categorias, nuevaCategoria]);
    setNuevaCategoria('');
  }
  function eliminarCategoria(cat){
    db.ref('categorias').set(categorias.filter(c => c !== cat));
  }

  function guardarConfig(){
    db.ref('config').set({whatsapp: whatsappInput, instagram: instagramInput});
  }

  const ESTADOS = [
    {key:'recibido', label:'Recibido', color:'bg-yellow-400'},
    {key:'en_proceso', label:'En proceso', color:'bg-blue-400'},
    {key:'entregado', label:'Entregado', color:'bg-green-500'}
  ];

  return (
    <div className="min-h-screen bg-pink-50">
      <header className="flex justify-between items-center p-4 bg-white shadow sticky top-0 z-10 flex-wrap gap-2">
        <h1 className="text-xl md:text-2xl font-bold text-pink-600">Dulce Benjamín</h1>
        <div className="flex gap-2 items-center flex-wrap">
          {config.whatsapp && (
            <a href={"https://wa.me/"+config.whatsapp} target="_blank"
               className="rounded-full bg-green-500 text-white text-xs md:text-sm font-bold px-3 py-2 shadow-md hover:shadow-lg transition-all flex items-center gap-1">
              💬 Mándame tu mensaje
            </a>
          )}
          {config.instagram && (
            <a href={"https://instagram.com/"+config.instagram} target="_blank"
               className="rounded-full bg-purple-500 text-white text-xs md:text-sm font-bold px-3 py-2 shadow-md hover:shadow-lg transition-all flex items-center gap-1">
              📷 Seguime en Instagram
            </a>
          )}
          <button onClick={()=>setMostrarCarrito(true)} className="relative bg-pink-500 text-white px-3 py-2 rounded-full">
            🛒
            {cantidadTotal>0 && <span className="absolute -top-2 -right-2 bg-red-500 text-xs rounded-full w-5 h-5 flex items-center justify-center">{cantidadTotal}</span>}
          </button>
          {!loggedIn ? (
            <button onClick={()=>setMostrarLogin(true)} className="text-2xl" title="Admin">🔒</button>
          ) : (
            <button onClick={()=>setMostrarAdmin(true)} className="relative text-2xl" title="Panel admin">
              ⚙️
              {pedidosPendientes>0 && <span className="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center">{pedidosPendientes}</span>}
            </button>
          )}
        </div>
      </header>

      <div className="p-3 pb-0">
        <input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="🔍 Buscar producto..." className="border rounded-full w-full p-2 px-4 text-sm"/>
      </div>

      <nav className="flex gap-2 overflow-x-auto p-3">
        {['Todos', ...categorias].map(cat=>(
          <button key={cat} onClick={()=>setCategoria(cat)}
            className={`px-4 py-2 rounded-full whitespace-nowrap text-sm ${categoria===cat?'bg-pink-500 text-white':'bg-white text-gray-700'}`}>
            {cat}
          </button>
        ))}
      </nav>

      <main className="grid grid-cols-2 md:grid-cols-4 gap-4 p-4">
        {productosFiltrados.length===0 && <p className="col-span-full text-center text-gray-400 py-10">No se encontraron productos.</p>}
        {productosFiltrados.map(p=>{
          const imgs = imagenesDe(p);
          const variantes = variantesDe(p);
          const precios = variantes.map(v=>v.precio);
          const precioTexto = precios.length>1 ? `Desde $${Math.min(...precios)}` : `$${precios[0] || 0}`;
          return (
            <div key={p.id} className="bg-white rounded-lg shadow p-3 relative">
              <div className="relative">
                <img src={imgs[0] || 'https://via.placeholder.com/200'} className={`w-full h-32 object-cover rounded ${p.agotado ? 'grayscale opacity-60' : ''}`}/>
                {p.agotado && <span className="absolute top-1 left-1 bg-gray-700 text-white text-xs px-2 py-1 rounded-full">Agotado</span>}
                <button onClick={()=>abrirProducto(p)}
                  className="absolute -bottom-2 -right-2 bg-pink-500 text-white w-8 h-8 rounded-full shadow-md hover:shadow-lg transition-all font-bold">+</button>
              </div>
              <h3 className="font-semibold mt-2 text-sm">{p.nombre}</h3>
              <p className="text-pink-600 font-bold">{precioTexto}</p>
              <button disabled={p.agotado} onClick={()=>agregarAlCarrito(p, variantes[0])}
                className={`mt-2 w-full py-1 rounded text-sm ${p.agotado ? 'bg-gray-300 text-gray-500' : 'bg-pink-500 text-white'}`}>
                {p.agotado ? 'Agotado' : 'Agregar'}
              </button>
            </div>
          );
        })}
      </main>

      {productoVisto && (() => {
        const imgs = imagenesDe(productoVisto);
        const variantes = variantesDe(productoVisto);
        return (
          <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-40 p-4" onClick={()=>setProductoVisto(null)}>
            <div className="bg-white rounded-lg max-w-md w-full overflow-y-auto max-h-full" onClick={e=>e.stopPropagation()}>
              <div className="relative">
                <img src={imgs[indiceImagen] || 'https://via.placeholder.com/400'} className={`w-full h-64 object-cover ${productoVisto.agotado ? 'grayscale opacity-60' : ''}`}/>
                <button onClick={()=>setProductoVisto(null)} className="absolute top-2 right-2 bg-white/80 rounded-full w-8 h-8">✕</button>
                <button onClick={()=>compartirProducto(productoVisto)} className="absolute top-2 left-2 bg-white/80 rounded-full w-8 h-8">🔗</button>
                {productoVisto.agotado && <span className="absolute bottom-2 left-2 bg-gray-700 text-white text-xs px-2 py-1 rounded-full">Agotado</span>}
                {imgs.length>1 && (
                  <>
                    <button onClick={()=>setIndiceImagen(i=>(i-1+imgs.length)%imgs.length)} className="absolute left-2 top-1/2 -translate-y-1/2 bg-white/80 rounded-full w-8 h-8">‹</button>
                    <button onClick={()=>setIndiceImagen(i=>(i+1)%imgs.length)} className="absolute right-2 top-1/2 -translate-y-1/2 bg-white/80 rounded-full w-8 h-8">›</button>
                    <div className="absolute bottom-2 left-0 right-0 flex justify-center gap-1">
                      {imgs.map((_,i)=><span key={i} className={`w-2 h-2 rounded-full ${i===indiceImagen?'bg-pink-500':'bg-white/70'}`}></span>)}
                    </div>
                  </>
                )}
              </div>
              <div className="p-4">
                <h3 className="font-bold text-lg">{productoVisto.nombre}</h3>
                <p className="text-sm text-gray-600 mb-3">{productoVisto.descripcion || 'Sin descripción.'}</p>
                <div className="space-y-2 mb-2">
                  {variantes.map((v,idx)=>(
                    <div key={idx} className="flex justify-between items-center border rounded-lg p-2">
                      <span className="text-sm">{v.cantidad} unidad{v.cantidad>1?'es':''} — <b className="text-pink-600">${v.precio}</b></span>
                      <button disabled={productoVisto.agotado} onClick={()=>agregarAlCarrito(productoVisto, v)}
                        className={`px-3 py-1 rounded-full text-sm ${productoVisto.agotado ? 'bg-gray-300 text-gray-500' : 'bg-pink-500 text-white'}`}>
                        Agregar
                      </button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      })()}

      {mostrarCarrito && (
        <div className="fixed inset-0 bg-black/50 flex justify-end z-20" onClick={()=>setMostrarCarrito(false)}>
          <div className="bg-white w-80 max-w-full h-full p-4 overflow-y-auto" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold">Presupuesto</h2>
              <button onClick={()=>setMostrarCarrito(false)}>✕</button>
            </div>

            {pedidoEnviado ? (
              <p className="text-green-600 font-bold text-center py-10">¡Pedido enviado! Te vamos a contactar pronto 🎉</p>
            ) : (
              <>
                {carrito.length===0 ? <p className="text-gray-500">Carrito vacío</p> : carrito.map(i=>(
                  <div key={i.cartId} className="flex justify-between items-center mb-3 border-b pb-2">
                    <div>
                      <p className="font-semibold text-sm">{i.nombre}</p>
                      <p className="text-xs text-gray-500">pack de {i.cantidadPack} — ${i.precioPack} c/u pack</p>
                    </div>
                    <div className="flex items-center gap-2">
                      <button onClick={()=>cambiarUnidades(i.cartId,-1)} className="w-6 h-6 bg-gray-200 rounded">-</button>
                      <span>{i.unidades}</span>
                      <button onClick={()=>cambiarUnidades(i.cartId,1)} className="w-6 h-6 bg-gray-200 rounded">+</button>
                      <button onClick={()=>quitarDelCarrito(i.cartId)} className="text-red-500 ml-2">🗑</button>
                    </div>
                  </div>
                ))}
                <div className="mt-2 font-bold text-lg flex justify-between mb-4">
                  <span>Total:</span><span>${total}</span>
                </div>

                {carrito.length>0 && (
                  <div className="border-t pt-4">
                    <h3 className="font-bold mb-2">Completá tus datos para pedir</h3>
                    <input value={datosPedido.nombre} onChange={e=>setDatosPedido({...datosPedido, nombre:e.target.value})} placeholder="Nombre" className="border rounded w-full p-2 mb-2"/>
                    <input value={datosPedido.telefono} onChange={e=>setDatosPedido({...datosPedido, telefono:e.target.value})} placeholder="Teléfono" className="border rounded w-full p-2 mb-2"/>
                    <input value={datosPedido.zona} onChange={e=>setDatosPedido({...datosPedido, zona:e.target.value})} placeholder="Zona" className="border rounded w-full p-2 mb-2"/>
                    <label className="text-xs text-gray-500">Fecha del evento</label>
                    <input value={datosPedido.fecha} onChange={e=>setDatosPedido({...datosPedido, fecha:e.target.value})} type="date" className="border rounded w-full p-2 mb-3"/>
                    <button onClick={enviarPedido} className="w-full bg-pink-500 text-white py-2 rounded font-bold">Enviar pedido</button>
                    <p className="text-xs text-gray-400 mt-2">Se va a abrir WhatsApp con el resumen para confirmar.</p>
                  </div>
                )}
              </>
            )}
          </div>
        </div>
      )}

      {mostrarLogin && (
        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-30" onClick={()=>setMostrarLogin(false)}>
          <div className="bg-white rounded-lg p-6 w-72" onClick={e=>e.stopPropagation()}>
            <h2 className="text-lg font-bold mb-4">Ingreso admin</h2>
            <input value={usuario} onChange={e=>setUsuario(e.target.value)} placeholder="Usuario" className="border rounded w-full p-2 mb-2"/>
            <input value={contrasena} onChange={e=>setContrasena(e.target.value)} type="password" placeholder="Contraseña" className="border rounded w-full p-2 mb-2"/>
            {errorLogin && <p className="text-red-500 text-sm mb-2">{errorLogin}</p>}
            <button onClick={intentarLogin} className="w-full bg-pink-500 text-white py-2 rounded">Ingresar</button>
          </div>
        </div>
      )}

      {mostrarAdmin && (
        <div className="fixed inset-0 bg-black/50 flex justify-end z-30" onClick={()=>setMostrarAdmin(false)}>
          <div className="bg-white w-full max-w-md h-full p-4 overflow-y-auto" onClick={e=>e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold">Panel admin</h2>
              <div className="flex gap-3">
                <button onClick={cerrarSesion} className="text-sm text-red-500">Cerrar sesión</button>
                <button onClick={()=>setMostrarAdmin(false)}>✕</button>
              </div>
            </div>

            <button onClick={pedirNotificaciones} className="text-xs bg-gray-100 rounded-full px-3 py-2 mb-4">🔔 Activar notificaciones de pedidos</button>

            <div className="flex gap-2 mb-4 overflow-x-auto">
              {['productos','categorias','redes','pedidos'].map(tab=>(
                <button key={tab} onClick={()=>setAdminTab(tab)}
                  className={`px-3 py-2 rounded-full text-sm whitespace-nowrap ${adminTab===tab?'bg-pink-500 text-white':'bg-gray-100'}`}>
                  {tab==='productos'?'Productos':tab==='categorias'?'Categorías':tab==='redes'?'Redes':`Pedidos${pedidosPendientes>0?` (${pedidosPendientes})`:''}`}
                </button>
              ))}
            </div>

            {adminTab==='productos' && (
              <div>
                <h3 className="font-bold mb-2">{editandoId ? 'Editar producto' : 'Nuevo producto'}</h3>
                <input value={form.nombre} onChange={e=>setForm({...form, nombre:e.target.value})} placeholder="Nombre" className="border rounded w-full p-2 mb-2"/>
                <select value={form.categoria} onChange={e=>setForm({...form, categoria:e.target.value})} className="border rounded w-full p-2 mb-2">
                  <option value="">Elegir categoría</option>
                  {categorias.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <textarea value={form.descripcion} onChange={e=>setForm({...form, descripcion:e.target.value})} placeholder="Descripción del producto" className="border rounded w-full p-2 mb-2" rows="3"></textarea>

                <label className="text-xs text-gray-500">Cantidades y precios (ej: 1 unidad $1000, 10 unidades $30000)</label>
                {form.variantes.map((v,idx)=>(
                  <div key={idx} className="flex gap-2 mb-2 items-center">
                    <input value={v.cantidad} onChange={e=>cambiarVariante(idx,'cantidad',e.target.value)} type="number" placeholder="Cant." className="border rounded p-2 w-20"/>
                    <span className="text-sm">x $</span>
                    <input value={v.precio} onChange={e=>cambiarVariante(idx,'precio',e.target.value)} type="number" placeholder="Precio" className="border rounded p-2 flex-1"/>
                    {form.variantes.length>1 && <button onClick={()=>quitarFilaVariante(idx)} className="text-red-500">✕</button>}
                  </div>
                ))}
                <button onClick={agregarFilaVariante} className="text-sm text-pink-600 mb-3">+ Agregar otra combinación</button>

                <label className="flex items-center gap-2 mb-3">
                  <input type="checkbox" checked={form.agotado} onChange={e=>setForm({...form, agotado:e.target.checked})}/>
                  <span className="text-sm">Marcar como agotado</span>
                </label>

                <label className="text-xs text-gray-500">Fotos (podés elegir varias)</label>
                <input type="file" accept="image/*" multiple onChange={handleImagenes} className="w-full mb-2"/>
                <div className="flex gap-2 flex-wrap mb-2">
                  {form.imagenes.map((img,idx)=>(
                    <div key={idx} className="relative">
                      <img src={img} className="w-16 h-16 object-cover rounded"/>
                      <button onClick={()=>quitarImagenForm(idx)} className="absolute -top-1 -right-1 bg-red-500 text-white w-5 h-5 rounded-full text-xs">✕</button>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2 mb-6">
                  <button onClick={guardarProducto} className="flex-1 bg-pink-500 text-white py-2 rounded">{editandoId ? 'Guardar cambios' : 'Agregar producto'}</button>
                  {editandoId && <button onClick={resetForm} className="px-4 bg-gray-200 rounded">Cancelar</button>}
                </div>

                <h3 className="font-bold mb-2">Productos cargados</h3>
                {listaProductos.map(p => (
                  <div key={p.id} className="flex justify-between items-center border-b py-2">
                    <span className="text-sm">{p.nombre} ({p.categoria}){p.agotado ? ' - Agotado' : ''}</span>
                    <div className="flex gap-2">
                      <button onClick={()=>editarProducto(p)} className="text-blue-500 text-sm">Editar</button>
                      <button onClick={()=>eliminarProducto(p.id)} className="text-red-500 text-sm">Borrar</button>
                    </div>
                  </div>
                ))}
              </div>
            )}

            {adminTab==='categorias' && (
              <div>
                <h3 className="font-bold mb-2">Categorías</h3>
                <div className="flex gap-2 mb-2">
                  <input value={nuevaCategoria} onChange={e=>setNuevaCategoria(e.target.value)} placeholder="Nueva categoría" className="border rounded flex-1 p-2"/>
                  <button onClick={agregarCategoria} className="bg-pink-500 text-white px-3 rounded">Agregar</button>
                </div>
                {categorias.map(c => (
                  <div key={c} className="flex justify-between items-center border-b py-1">
                    <span className="text-sm">{c}</span>
                    <button onClick={()=>eliminarCategoria(c)} className="text-red-500 text-sm">Borrar</button>
                  </div>
                ))}
              </div>
            )}

            {adminTab==='redes' && (
              <div>
                <h3 className="font-bold mb-2">Redes sociales</h3>
                <label className="text-xs text-gray-500">WhatsApp (solo número, ej: 5491122334455)</label>
                <input value={whatsappInput} onChange={e=>setWhatsappInput(e.target.value)} placeholder="5491122334455" className="border rounded w-full p-2 mb-2"/>
                <label className="text-xs text-gray-500">Usuario de Instagram (sin @)</label>
                <input value={instagramInput} onChange={e=>setInstagramInput(e.target.value)} placeholder="dulcebenjamin" className="border rounded w-full p-2 mb-2"/>
                <button onClick={guardarConfig} className="w-full bg-pink-500 text-white py-2 rounded mt-2">Guardar redes</button>
              </div>
            )}

            {adminTab==='pedidos' && (
              <div>
                <h3 className="font-bold mb-2">Pedidos</h3>
                {listaPedidos.length===0 && <p className="text-gray-400 text-sm">Todavía no hay pedidos.</p>}
                {listaPedidos.map(ped => (
                  <div key={ped.id} className="border rounded p-3 mb-3">
                    <p className="font-semibold text-sm">{ped.nombre} - {ped.telefono}</p>
                    <p className="text-xs text-gray-500">Zona: {ped.zona} | Evento: {ped.fecha}</p>
                    <div className="my-2">
                      {(ped.items||[]).map((it,idx)=>(
                        <p key={idx} className="text-xs text-gray-600">{it.unidades}x {it.nombre} (pack {it.cantidadPack} - ${it.precioPack})</p>
                      ))}
                    </div>
                    <p className="font-bold text-pink-600 mb-2">Total: ${ped.total}</p>
                    <div className="flex gap-2 flex-wrap">
                      {ESTADOS.map(e=>(
                        <button key={e.key} onClick={()=>cambiarEstadoPedido(ped.id, e.key)}
                          className={`px-3 py-1 rounded-full text-xs text-white ${ped.estado===e.key ? e.color : 'bg-gray-300'}`}>
                          {e.label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
